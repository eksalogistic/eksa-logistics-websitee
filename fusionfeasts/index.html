<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Fusion Feasts Portal | EKSA Logistic</title>
  <link rel="icon" href="../favicon.png">

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #07152f, #253b82);
      color: white;
      text-align: center;
    }

    .portal {
      padding: 45px 30px;
      max-width: 500px;
    }

    .logo {
      width: 220px;
      max-width: 90%;
      margin-bottom: 25px;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 15px;
    }

    p {
      color: #d4def2;
      line-height: 1.7;
      margin-bottom: 30px;
    }

    .button {
      display: inline-block;
      padding: 17px 32px;
      background: linear-gradient(90deg, #009bff, #6726ff);
      color: white;
      text-decoration: none;
      border-radius: 12px;
      font-weight: bold;
    }

    .button:hover {
      opacity: 0.9;
    }

    .footer {
      margin-top: 35px;
      font-size: 12px;
      color: #aebbd3;
    }
  </style>
</head>

<body>
  <main class="portal">

    <img
      src="../eksa-logo.png"
      alt="EKSA Logistic"
      class="logo"
    >

    <h1>Fusion Feasts Delivery Portal</h1>

    <p>
      Welcome to the Fusion Feasts Delivery Portal,
      powered by EKSA Logistic.
      Access your delivery management system below.
    </p>

    <a
      class="button"
      href="https://script.google.com/macros/s/AKfycbzq2rcf4ts9uuoo10F6LjIHkfpm8Ls-799U8cGaTy5HFEsiiTY6_NZzoEOHmO9KtOD8/exec"
      target="_blank"
      rel="noopener noreferrer"
    >
      Launch Delivery Portal &rarr;
    </a>

    <div class="footer">
      EKSA Logistic Inc. | Dreams Delivered.
    </div>

  </main>
</body>
</html>
